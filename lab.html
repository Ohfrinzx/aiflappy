<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Hitch lab</title>
    <link rel="icon" href="icon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        background: #000;
        color: #fff;
        font: 13px/1.4 -apple-system, system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      body {
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
      }
      .bar {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        padding: 6px 0 0;
      }
      button {
        font: inherit;
        color: #fff;
        background: #333;
        border: 1px solid #666;
        border-radius: 6px;
        padding: 6px 10px;
      }
      button.on {
        background: #2e7d32;
        border-color: #4caf50;
      }
      .label {
        padding: 8px 0 4px;
        color: #ccc;
      }
      canvas {
        display: block;
        width: 100%;
        flex: 1;
        min-height: 0;
      }
      #stats {
        white-space: pre;
        font: 11px/1.5 ui-monospace, Menlo, monospace;
        color: #ddd;
        padding: 6px 0;
      }
    </style>
  </head>
  <body>
    <div class="bar">B paced at: <button data-pace="120">120/s</button><button data-pace="240">240/s</button></div>
    <div class="bar">Keepalive: <button data-keep="off">off</button><button data-keep="fast">fast scroll</button></div>
    <div class="label">A: main thread + requestAnimationFrame (how the game draws now)</div>
    <canvas id="main"></canvas>
    <div class="label">B: worker + OffscreenCanvas (own clock)</div>
    <canvas id="worker"></canvas>
    <div id="stats"></div>
    <script type="module" src="src/lab/main.js"></script>
  </body>
</html>
